<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 專屬智慧助理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f0f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #1f1f1f;
    }
    .chat-card {
      width: 100%;
      max-width: 480px;
      height: 90vh;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      background: linear-gradient(135deg, #1a73e8, #0d47a1);
      color: white;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 40px;
      height: 40px;
      background: white;
      color: #1a73e8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }
    .header-info h2 { font-size: 16px; font-weight: 600; }
    .header-info p { font-size: 12px; opacity: 0.85; }
    .messages-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .bubble {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.5;
      word-break: break-word;
    }
    .bubble.user {
      align-self: flex-end;
      background: #1a73e8;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .bubble.bot {
      align-self: flex-start;
      background: #f1f3f4;
      color: #202124;
      border-bottom-left-radius: 4px;
    }
    .loading-indicator {
      display: none;
      align-self: flex-start;
      background: #f1f3f4;
      padding: 10px 16px;
      border-radius: 18px;
      font-size: 13px;
      color: #5f6368;
    }
    .input-area {
      padding: 14px 16px;
      border-top: 1px solid #e0e0e0;
      background: #ffffff;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input[type="text"] {
      flex: 1;
      border: 1px solid #dadce0;
      border-radius: 24px;
      padding: 12px 18px;
      outline: none;
      font-size: 14.5px;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #1a73e8;
    }
    button {
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #1557b0; }
    button:active { transform: scale(0.95); }
    button:disabled { background: #dadce0; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-card">
    <div class="chat-header">
      <div class="avatar">✨</div>
      <div class="header-info">
        <h2>專屬 AI 智慧助理</h2>
        <p>Google Apps Script × Gemini</p>
      </div>
    </div>
    
    <div class="messages-container" id="msgBox">
      <div class="bubble bot">
        您好！我是您的專屬 AI 客服助理。請問今天有什麼我可以為您協助的嗎？
      </div>
      <div class="loading-indicator" id="loading">AI 思考中...</div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="請輸入訊息..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button id="sendBtn" onclick="sendMessage()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const sessionId = 'session_' + Math.random().toString(36).substring(2, 9);

    function sendMessage() {
      const input = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const text = input.value.trim();
      if (!text) return;

      appendBubble(text, 'user');
      input.value = '';
      input.disabled = true;
      sendBtn.disabled = true;

      const loading = document.getElementById('loading');
      loading.style.display = 'block';
      const msgBox = document.getElementById('msgBox');
      msgBox.scrollTop = msgBox.scrollHeight;

      google.script.run
        .withSuccessHandler(function(res) {
          loading.style.display = 'none';
          input.disabled = false;
          sendBtn.disabled = false;
          input.focus();
          if (res.success) {
            appendBubble(res.reply, 'bot');
          } else {
            appendBubble('⚠️ 系統提示：' + res.error, 'bot');
          }
        })
        .withFailureHandler(function(err) {
          loading.style.display = 'none';
          input.disabled = false;
          sendBtn.disabled = false;
          appendBubble('⚠️ 連線發生錯誤，請稍後重試。', 'bot');
        })
        .processUserMessage(text, sessionId);
    }

    function appendBubble(text, sender) {
      const msgBox = document.getElementById('msgBox');
      const loading = document.getElementById('loading');
      const div = document.createElement('div');
      div.className = `bubble ${sender}`;
      div.innerText = text;
      msgBox.insertBefore(div, loading);
      msgBox.scrollTop = msgBox.scrollHeight;
    }
  </script>
</body>
</html>
